[project]
name = "tailwatch-server"
version = "1.0.0"
description = "Tailwatch server: ingestion, query, alerting, and writer workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psycopg[binary,pool]>=3.2.0",
    "redis>=5.1.0",
    "orjson>=3.10.7",
    "zstandard>=0.23.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.1",
    "httpx>=0.27.2",
    "aiosmtplib>=3.0.2",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "alembic>=1.13.3",
    "sqlalchemy>=2.0.35"
]

[project.scripts]
tailwatch = "tailwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
